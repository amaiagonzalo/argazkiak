baseURL = 'https://amaiagonzalo.github.io/argazkiak/'
title = 'Amaia Gonzalo'
defaultContentLanguage = 'eu'
defaultContentLanguageInSubdir = false
enableRobotsTXT = true
disableKinds = ['taxonomy', 'term']

[params]
  author = 'Amaia Gonzalo'

[imaging]
  resampleFilter = 'Lanczos'
  [imaging.webp]
    quality = 82

# No publicar las fotos originales (pueden llevar EXIF con la ubicación GPS):
# solo se publican las versiones redimensionadas, que Hugo genera sin metadatos.
[[cascade]]
  [cascade.build]
    publishResources = false
  [cascade.target]
    path = '{/argazkiliburuak/**,/urtekariak/**,/about}'

[languages]
  [languages.eu]
    locale = 'eu'
    label = 'Euskara'
    weight = 1
    title = 'Amaia Gonzalo · Argazkiak'
    [languages.eu.params]
      description = 'Amaia Gonzaloren argazki proiektuak.'
    [[languages.eu.menus.main]]
      name = 'Argazkiliburuak'
      pageRef = '/argazkiliburuak'
      weight = 1
    [[languages.eu.menus.main]]
      name = 'Urtekariak'
      pageRef = '/urtekariak'
      weight = 2
    [[languages.eu.menus.main]]
      name = 'Niri buruz'
      pageRef = '/about'
      weight = 3

  [languages.es]
    locale = 'es-ES'
    label = 'Castellano'
    weight = 2
    title = 'Amaia Gonzalo · Fotografía'
    [languages.es.params]
      description = 'Proyectos fotográficos de Amaia Gonzalo.'
    [languages.es.permalinks.section]
      argazkiliburuak = '/fotolibros/'
      urtekariak = '/anuarios/'
    [languages.es.permalinks.page]
      argazkiliburuak = '/fotolibros/:contentbasename/'
      urtekariak = '/anuarios/:contentbasename/'
    [[languages.es.menus.main]]
      name = 'Fotolibros'
      pageRef = '/argazkiliburuak'
      weight = 1
    [[languages.es.menus.main]]
      name = 'Anuarios'
      pageRef = '/urtekariak'
      weight = 2
    [[languages.es.menus.main]]
      name = 'Sobre mí'
      pageRef = '/about'
      weight = 3

  [languages.en]
    locale = 'en-GB'
    label = 'English'
    weight = 3
    title = 'Amaia Gonzalo · Photography'
    [languages.en.params]
      description = 'Photography projects by Amaia Gonzalo.'
    [languages.en.permalinks.section]
      argazkiliburuak = '/photobooks/'
      urtekariak = '/yearbooks/'
    [languages.en.permalinks.page]
      argazkiliburuak = '/photobooks/:contentbasename/'
      urtekariak = '/yearbooks/:contentbasename/'
    [[languages.en.menus.main]]
      name = 'Photobooks'
      pageRef = '/argazkiliburuak'
      weight = 1
    [[languages.en.menus.main]]
      name = 'Yearbooks'
      pageRef = '/urtekariak'
      weight = 2
    [[languages.en.menus.main]]
      name = 'About'
      pageRef = '/about'
      weight = 3
