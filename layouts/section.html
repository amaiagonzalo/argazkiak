{{ define "main" }}
  <header class="page-head">
    <h1 class="display">{{ .Title }}</h1>
    {{ .Content }}
  </header>
  {{ with .Pages }}
    {{ partial "book-list.html" . }}
  {{ else }}
    {{/* Sección todavía vacía (por ejemplo, Anuarios antes de subir el primero) */}}
    <p class="soon">{{ i18n "soon" }}</p>
  {{ end }}
{{ end }}
