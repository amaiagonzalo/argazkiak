{{ define "main" }}
  <section class="intro">
    <h1>{{ .Title | default site.Title }}</h1>
    {{ .Content }}
  </section>
  {{ with site.GetPage "/proiektuak" }}
    <section aria-labelledby="projects-title">
      <h2 id="projects-title" class="section-title">{{ .Title }}</h2>
      {{ partial "project-grid.html" .Pages }}
    </section>
  {{ end }}
{{ end }}
